:root{--g:#1E3D2F;--c:#F0E6C8;--d:#C9962A;--red:#b3261e;--ok:#2e7d32;--bg:#f6f2e4;--line:#ddd5b8}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--g);min-height:100vh}
h1,h2,h3{font-family:'Moche',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px 10px;border:1.5px solid #c9c2a8;border-radius:8px;background:#fff;color:var(--g);max-width:100%}
textarea{width:100%;min-height:80px}
.btn{background:var(--g);color:var(--c);border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.alt{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.red{background:var(--red);color:#fff}
.btn.gold{background:var(--d);color:var(--g)}
.btn:disabled{opacity:.4}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--g);padding:20px}
#login .box{background:var(--c);border-radius:16px;padding:28px;width:100%;max-width:340px;text-align:center}
#login img{height:40px;margin-bottom:16px}
#login input{width:100%;margin:12px 0}
#lerr{color:var(--red);font-size:13px;min-height:18px}
header.top{background:var(--g);color:var(--c);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
header.top img{height:26px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav button{background:none;border:0;color:var(--c);padding:8px 12px;border-radius:8px;font-size:14px;white-space:nowrap;opacity:.75}
nav button.on{background:var(--d);color:var(--g);opacity:1;font-weight:700}
main{max-width:1200px;margin:0 auto;padding:18px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px rgba(30,61,47,.1)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 5px rgba(30,61,47,.1)}
.stat b{display:block;font-family:'Moche',system-ui;font-size:30px}
.stat span{font-size:12px;color:#5b7566}
.stat.warn b{color:var(--red)}
h2{font-size:22px;margin-bottom:10px}
h3{font-size:17px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.row label{font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:#5b7566;text-transform:uppercase}
.tw{overflow-x:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eee;margin:1px}
.tag.red{background:#fdeceb;color:var(--red)}
.tag.ok{background:#e6f3e7;color:#1b5e20}
.tag.gold{background:#fff1cc;color:#7a5500}
details{margin:4px 0 4px 0}
details>summary{cursor:pointer;padding:7px 8px;border-radius:8px;background:#f2eed9;font-weight:600;font-size:14px}
details details{margin-left:14px}
details details>summary{background:#f8f5e8}
.vrow{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;flex-wrap:wrap;margin-left:14px}
.vrow:hover{background:#faf6e6}
.muted{color:#6c8576;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.modal .m{background:#fff;border-radius:14px;padding:20px;max-width:900px;width:100%}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0 14px}
.pgrid figure{margin:0;font-size:11px}
.pgrid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in;background:#eee}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:96vw;max-height:94vh}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair img{width:100%;border-radius:8px}
#banner{background:var(--red);color:#fff;text-align:center;padding:8px;font-size:13px}
#ver{position:fixed;right:8px;bottom:6px;background:var(--g);color:var(--c);font-size:11px;padding:2px 8px;border-radius:8px;z-index:70}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;background:var(--g);color:var(--c);padding:9px 16px;border-radius:20px;font-size:14px;z-index:80}
.ai{background:#f4f9f5;border-left:4px solid var(--ok);padding:10px;border-radius:6px;font-size:14px;white-space:pre-wrap;margin-top:8px}
.days label{display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:13px}
.days input{width:auto}
@media(max-width:700px){.pair{grid-template-columns:1fr}main{padding:12px}}
</style>
</head>
<body>

const VERSION='v1.3';
const PASS='maturi2025';
const PROXY='https://maturi-ai-proxy.contato-7ed.workers.dev';
const cfg={apiKey:"AIzaSyCfqBr0MgVhgRi2xhGjtXE_Y7tzeZKlPKQ",authDomain:"maturi-promotoria.firebaseapp.com",projectId:"maturi-promotoria",storageBucket:"maturi-promotoria.firebasestorage.app",messagingSenderId:"931145421913",appId:"1:931145421913:web:66560473caaee307e20d48"};
const app=initializeApp(cfg);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const slug=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fmtDur=s=>{if(s==null)return '—';s=Math.round(s);const m=Math.floor(s/60);return m?m+'min '+(s%60)+'s':s+'s'};
const fmtTime=t=>{if(!t)return '—';const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtDate=k=>k?k.split('-').reverse().join('/'):'—';
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const monthName=m=>MONTHS[parseInt(m.slice(5,7),10)-1]+' '+m.slice(0,4);
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const FLAGS={foto_sem_camera_ao_vivo:'Foto sem câmera ao vivo',coordenada_congelada:'GPS idêntico em todas as amostras',precisao_irreal:'Precisão de GPS irreal',timestamp_defasado:'Horário do GPS defasado',coordenada_redonda:'Coordenadas “redondas”',salto_posicao:'Salto brusco de posição',poucas_amostras:'Poucas amostras de GPS',fuso_fora_brasil:'Fuso horário fora do Brasil',automacao:'Navegador automatizado',loja_sem_coordenadas:'Loja sem coordenadas cadastradas',tentou_fora_do_local:'Tentou validar fora do local',saiu_do_local_antes_do_fim:'Saiu da loja antes de finalizar'};
const SEVERE=['coordenada_congelada','precisao_irreal','timestamp_defasado','salto_posicao','fuso_fora_brasil','automacao','foto_sem_camera_ao_vivo','tentou_fora_do_local','saiu_do_local_antes_do_fim'];
const UFN={AC:'Acre',AL:'Alagoas',AP:'Amapá',AM:'Amazonas',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MT:'Mato Grosso',MS:'Mato Grosso do Sul',MG:'Minas Gerais',PA:'Pará',PB:'Paraíba',PR:'Paraná',PE:'Pernambuco',PI:'Piauí',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RS:'Rio Grande do Sul',RO:'Rondônia',RR:'Roraima',SC:'Santa Catarina',SP:'São Paulo',SE:'Sergipe',TO:'Tocantins'};
const ufOpts=(sel,all)=>(all?'<option value="">Todos os estados</option>':'<option value="">Estado (automático se vazio)</option>')+Object.keys(UFN).map(u=>`<option value="${u}" ${u===sel?'selected':''}>${u} — ${UFN[u]}</option>`).join('');
const state={nets:[],stores:[],visits:[],tab:'painel',chart:null,period:30,promoNet:'',cronoNet:'',lojaNet:'',dups:null};

function toast(m,ms=2200){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,ms)}

/* ---------- dados ---------- */
async function load(){
  const [n,s,v]=await Promise.all([
    getDocs(collection(db,'networks')),getDocs(collection(db,'stores')),
    getDocs(query(collection(db,'visits'),orderBy('startedAt','desc'),limit(2000)))]);
  state.nets=n.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
  state.stores=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.networkName+a.name).localeCompare(b.networkName+b.name,'pt-BR'));
  state.visits=v.docs.map(d=>({id:d.id,...d.data()}));
}
async function boot(){
  $('ver').textContent='Painel '+VERSION;
  try{await load()}catch(e){banner('Erro ao ler o banco: '+(e.code||e.message)+'. Confira as regras do Firestore e a configuração.')}
  getDocsFromServer(collection(db,'networks')).then(()=>{}).catch(e=>{
    banner(e.code==='permission-denied'?'Regras do Firestore bloqueando o acesso (projeto maturi-promotoria).':'Sem conexão com o banco ('+(e.code||'erro')+').')});
  show(state.tab);
}
function show(t){
  state.tab=t;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  ['painel','promo','crono','redes','lojas','pessoas','audit'].forEach(x=>$('t-'+x).hidden=(x!==t));
  ({painel:rPainel,promo:rPromo,crono:rCrono,redes:rRedes,lojas:rLojas,pessoas:rPessoas,audit:rAudit})[t]();
}
const netOpts=(sel,all)=>(all?'<option value="">Todas as redes</option>':'<option value="">Selecione…</option>')+state.nets.map(n=>`<option value="${esc(n.id)}" ${n.id===sel?'selected':''}>${esc(n.name)}</option>`).join('');
const done=()=>state.visits.filter(v=>v.status==='concluida');

/* ---------- PAINEL ---------- */
function missingSched(){
  const out=[],today=new Date();
  for(let i=0;i<7;i++){
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-i),k=dkey(d),wd=d.getDay();
    state.stores.forEach(s=>{
      const sc=s.schedule;if(!sc||!sc.days||!sc.days.includes(wd))return;
      if(s.scheduleFrom&&k<s.scheduleFrom)return;
      const need=sc.perDay||1;
      const have=state.visits.filter(v=>v.storeId===s.id&&v.dateKey===k&&v.status==='concluida').length;
      if(have<need)out.push({store:s,date:k,today:i===0,need,have});
    });
  }
  return out;
}
function rPainel(){
  const now=new Date(),tk=dkey(now),mk=tk.slice(0,7);
  const wk=dkey(new Date(now.getFullYear(),now.getMonth(),now.getDate()-6));
  const D=done();
  const nToday=D.filter(v=>v.dateKey===tk).length,nWeek=D.filter(v=>v.dateKey>=wk).length,nMonth=D.filter(v=>v.dateKey.slice(0,7)===mk).length;
  const active=state.visits.filter(v=>v.status==='andamento'&&v.dateKey===tk).length;
  const susp=state.visits.filter(v=>v.dateKey>=wk&&(v.flags||[]).some(f=>SEVERE.includes(f))).length;
  const miss=missingSched(),missPast=miss.filter(m=>!m.today);
  const from=dkey(new Date(now.getFullYear(),now.getMonth(),now.getDate()-state.period));
  const rows=state.nets.map(n=>{
    const vs=D.filter(v=>v.networkId===n.id&&v.dateKey>=from&&(v.expected||[]).length&&(!state.painelUF||v.uf===state.painelUF));
    let exp=0,mis=0;const cnt={};
    vs.forEach(v=>{exp+=v.expected.length;mis+=(v.missing||[]).length;(v.missing||[]).forEach(f=>cnt[f]=(cnt[f]||0)+1)});
    const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,4);
    return {n,visits:vs.length,pct:exp?mis/exp*100:null,top};
  });
  const byDate={};miss.forEach(m=>{(byDate[m.date]=byDate[m.date]||[]).push(m)});
  const missHtml=Object.keys(byDate).sort().reverse().map(k=>`<details ${k===tk?'open':''}><summary>${fmtDate(k)} — ${byDate[k].length} loja(s) ${k===tk?'(hoje, ainda pode ser realizada)':'sem promotoria'}</summary><div class="tw"><table><tbody>${byDate[k].map(m=>`<tr><td>${esc(m.store.networkName)}</td><td>${esc(m.store.name)}</td><td class="muted">${m.have}/${m.need} visita(s)</td></tr>`).join('')}</tbody></table></div></details>`).join('')||'<p class="muted">Nenhuma pendência nos últimos 7 dias. 🎉 (Cadastre o cronograma na aba Cronograma.)</p>';
  $('t-painel').innerHTML=`
  <h2>Visão geral</h2>
  <div class="cards">
    <div class="stat"><b>${nToday}</b><span>Promotorias hoje</span></div>
    <div class="stat"><b>${nWeek}</b><span>Últimos 7 dias</span></div>
    <div class="stat"><b>${nMonth}</b><span>Neste mês</span></div>
    <div class="stat"><b>${active}</b><span>Em andamento agora</span></div>
    <div class="stat ${missPast.length?'warn':''}"><b>${missPast.length}</b><span>Visitas não realizadas (7 dias)</span></div>
    <div class="stat ${susp?'warn':''}"><b>${susp}</b><span>Visitas com alerta (7 dias)</span></div>
  </div>
  <div class="card"><h3>Lojas com promotoria pendente / faltando</h3>${missHtml}</div>
  <div class="card">
    <div class="row"><h3 style="margin:0">Ruptura por rede</h3>
      <label>Estado <select data-act="painelUF">${ufOpts(state.painelUF,true)}</select></label>
      <label>Período <select data-act="period">${[7,30,90].map(p=>`<option value="${p}" ${p===state.period?'selected':''}>${p} dias</option>`).join('')}</select></label></div>
    <p class="muted" style="margin-bottom:8px">% = sabores em falta ÷ sabores cadastrados na rede (soma das promotorias concluídas no período).</p>
    <div style="position:relative;height:${Math.max(220,rows.length*34)}px"><canvas id="ch"></canvas></div>
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Rede</th><th>Promotorias</th><th>Ruptura</th><th>Mais faltaram</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.n.name)}</td><td>${r.visits}</td><td>${r.pct==null?'—':r.pct.toFixed(1)+'%'}</td><td>${r.top.map(t=>`<span class="tag red">${esc(t[0])} (${t[1]})</span>`).join('')||'—'}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
  if(state.chart){state.chart.destroy();state.chart=null}
  if(window.Chart&&rows.length){
    const css=getComputedStyle(document.documentElement);
    state.chart=new Chart($('ch'),{type:'bar',data:{labels:rows.map(r=>r.n.name),datasets:[{label:'% ruptura',data:rows.map(r=>r.pct==null?0:+r.pct.toFixed(1)),backgroundColor:rows.map(r=>r.pct!=null&&r.pct>=25?'#b3261e':'#1E3D2F'),borderRadius:4}]},
      options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,max:100,ticks:{callback:v=>v+'%'}}}}});
  }
}

/* ---------- PROMOTORIAS ---------- */
function rPromo(){
  const q=state.promoQ||'';
  let vs=state.visits.filter(v=>v.status!=='cancelada');
  if(state.promoNet)vs=vs.filter(v=>v.networkId===state.promoNet);
  if(q)vs=vs.filter(v=>(v.promoter+' '+v.storeName).toLowerCase().includes(q.toLowerCase()));
  const tree={};
  vs.forEach(v=>{const n=v.networkName||'?',m=v.month||(v.dateKey||'').slice(0,7),d=v.dateKey;((((tree[n]=tree[n]||{})[m]=tree[n][m]||{})[d])=tree[n][m][d]||[]).push(v)});
  let h='';
  Object.keys(tree).sort().forEach(n=>{
    const cnt=Object.values(tree[n]).reduce((a,m)=>a+Object.values(m).reduce((b,d)=>b+d.length,0),0);
    h+=`<details ${state.promoNet?'open':''}><summary>${esc(n)} <span class="muted">· ${cnt}</span></summary>`;
    Object.keys(tree[n]).sort().reverse().forEach((m,mi)=>{
      h+=`<details ${mi===0?'open':''}><summary>${esc(monthName(m))}</summary>`;
      Object.keys(tree[n][m]).sort().reverse().forEach(d=>{
        h+=`<details><summary>${fmtDate(d)} <span class="muted">· ${tree[n][m][d].length}</span></summary>`;
        tree[n][m][d].sort((a,b)=>b.startedAt-a.startedAt).forEach(v=>{
          const sev=(v.flags||[]).filter(f=>SEVERE.includes(f)).length;
          h+=`<div class="vrow" data-act="visit" data-id="${esc(v.id)}"><b>${esc(v.promoter)}</b><span>${esc(v.storeName)}</span><span class="muted">${fmtTime(v.startedAt)}–${fmtTime(v.finishedAt)} · ${fmtDur(v.durationSec)}</span>${v.status==='concluida'?'<span class="tag ok">concluída</span>':'<span class="tag gold">em andamento</span>'}${sev?`<span class="tag red">⚠ ${sev} alerta(s)</span>`:''}${(v.missing||[]).length?`<span class="tag red">${v.missing.length} em falta</span>`:''}</div>`;
        });
        h+='</details>';
      });
      h+='</details>';
    });
    h+='</details>';
  });
  $('t-promo').innerHTML=`<h2>Promotorias realizadas</h2>
  <div class="row"><select data-act="promoNet">${netOpts(state.promoNet,true)}</select><input data-act="promoQ" placeholder="Buscar promotor ou loja" value="${esc(q)}"></div>
  <div class="card">${h||'<p class="muted">Nenhuma promotoria encontrada.</p>'}</div>`;
}
async function getPhotos(id){
  const s=await getDocs(collection(db,'visits',id,'photos'));
  const o={};s.docs.forEach(d=>o[d.id]=d.data());return o;
}
const PH=[['b1','Antes · alcoólicos'],['b2','Antes · preço alcoól.'],['b3','Antes · sucos'],['b4','Antes · preço sucos'],['a1','Depois · alcoólicos'],['a2','Depois · preço alcoól.'],['a3','Depois · sucos'],['a4','Depois · preço sucos'],['e1','Validade']];
async function openVisit(id){
  const v=state.visits.find(x=>x.id===id);if(!v)return;
  const m=$('modal');m.hidden=false;
  const g=v.gps;
  m.innerHTML=`<div class="m"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(v.promoter)}</h2><button class="btn alt" data-act="closemodal">Fechar</button></div>
  <p>${esc(v.networkName)} · ${esc(v.storeName)}${v.uf?' · '+esc(v.uf):''}<br><span class="muted">${fmtDate(v.dateKey)} · ${fmtTime(v.startedAt)} → ${fmtTime(v.finishedAt)} · duração ${fmtDur(v.durationSec)}</span></p>
  <p style="margin-top:8px">${g?`GPS: a <b>${g.dist==null?'?':g.dist+' m'}</b> da loja (precisão ±${g.acc} m, ${g.samples} amostras) · <a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${g.lat},${g.lng}">ver no mapa</a>`:'GPS não registrado'}${v.endGps?` · ao finalizar: ${v.endGps.dist==null?'?':v.endGps.dist+' m'}`:''}</p>
  <p style="margin-top:6px">${(v.flags||[]).map(f=>`<span class="tag ${SEVERE.includes(f)?'red':''}">${esc(FLAGS[f]||f)}</span>`).join('')||'<span class="tag ok">Sem alertas</span>'}</p>
  <p style="margin-top:8px"><b>Sabores em falta:</b> ${(v.missing||[]).map(x=>`<span class="tag red">${esc(x)}</span>`).join('')||'nenhum'}</p>
  <p style="margin-top:8px"><b>Validade informada:</b> ${esc(v.expDate||'—')} <span class="muted">(sabor sorteado: ${esc(v.expFlavor||'—')})</span></p>
  ${v.note?`<p style="margin-top:8px"><b>Observação:</b> ${esc(v.note)}</p>`:''}
  <h3 style="margin-top:14px">Fotos</h3><div id="vph" class="muted">Carregando fotos…</div><div id="vai"></div></div>`;
  try{
    const ph=await getPhotos(id);window.__ph=ph;
    $('vph').innerHTML='<div class="pgrid">'+PH.filter(p=>ph[p[0]]).map(p=>`<figure><img data-act="zoom" data-k="${p[0]}" src="${ph[p[0]].data}" alt=""><figcaption>${esc(p[1])} · ${fmtTime(ph[p[0]].ts)}${ph[p[0]].live===false?' ⚠':''}</figcaption></figure>`).join('')+'</div>'+(ph.e1?`<button class="btn gold" data-act="aiexp" data-id="${esc(id)}">🤖 Ler validade com IA</button>`:'')||'Sem fotos.';
  }catch(e){$('vph').textContent='Erro ao carregar fotos: '+(e.code||e.message)}
}
function zoom(src){const l=$('lb');l.innerHTML='<img alt="" src="'+src+'">';l.hidden=false}

/* ---------- CRONOGRAMA ---------- */
function rCrono(){
  const nid=state.cronoNet;const list=state.stores.filter(s=>s.networkId===nid&&(!state.cronoUF||s.uf===state.cronoUF));
  let perWeek=0;list.forEach(s=>{const sc=s.schedule;if(sc&&sc.days)perWeek+=sc.days.length*(sc.perDay||1)});
  $('t-crono').innerHTML=`<h2>Cronograma de visitas</h2>
  <p class="muted" style="margin-bottom:10px">Defina em quais dias da semana cada loja deve receber promotoria. O painel cobra automaticamente as visitas que não foram registradas.</p>
  <div class="row"><select data-act="cronoNet">${netOpts(nid)}</select><select data-act="cronoUF">${ufOpts(state.cronoUF,true)}</select>${nid&&list.length?`<button class="btn alt" data-act="cronoAll">Copiar a 1ª loja para todas da rede</button><span class="muted">${perWeek} visita(s)/semana na rede</span>`:''}</div>
  <div class="card tw">${nid?(list.length?`<table><thead><tr><th>Loja</th><th>Dias da semana</th><th>Visitas/dia</th></tr></thead><tbody>${list.map(s=>{const sc=s.schedule||{days:[],perDay:1};return `<tr><td>${esc(s.name)} <span class="muted">${esc(s.uf||'')}</span></td><td class="days">${WD.map((n,i)=>`<label><input type="checkbox" data-act="sch" data-id="${esc(s.id)}" data-d="${i}" ${sc.days.includes(i)?'checked':''}>${n}</label>`).join('')}</td><td><select data-act="schper" data-id="${esc(s.id)}"><option value="1" ${(sc.perDay||1)===1?'selected':''}>1</option><option value="2" ${sc.perDay===2?'selected':''}>2</option></select></td></tr>`}).join('')}</tbody></table>`:'<p class="muted">Esta rede não tem lojas cadastradas.</p>'):'<p class="muted">Selecione uma rede.</p>'}</div>`;
}
async function saveSched(id,days,perDay){
  const s=state.stores.find(x=>x.id===id);if(!s)return;
  const had=s.schedule&&s.schedule.days&&s.schedule.days.length;
  const data={schedule:{days,perDay}};
  if(!had&&days.length)data.scheduleFrom=dkey(new Date());
  Object.assign(s,data);
  try{await updateDoc(doc(db,'stores',id),data);toast('Salvo ✓')}catch(e){toast('Erro ao salvar: '+(e.code||e.message),4000)}
}
function readSched(id){
  const days=[...document.querySelectorAll('input[data-act="sch"][data-id="'+id+'"]')].filter(x=>x.checked).map(x=>+x.dataset.d);
  const sel=document.querySelector('select[data-act="schper"][data-id="'+id+'"]');
  return {days,perDay:sel?+sel.value:1};
}
async function cronoAll(){
  const list=state.stores.filter(s=>s.networkId===state.cronoNet);if(list.length<2)return;
  const base=readSched(list[0].id);if(!confirm('Aplicar '+(base.days.map(d=>WD[d]).join(', ')||'nenhum dia')+' a todas as '+list.length+' lojas?'))return;
  for(const s of list)await saveSched(s.id,base.days,base.perDay);
  rCrono();
}

/* ---------- REDES ---------- */
function rRedes(){
  $('t-redes').innerHTML=`<h2>Redes &amp; Ações</h2>
  <p class="muted" style="margin-bottom:10px">Cada rede tem seus sabores (usados na ruptura) e uma mensagem de ação/acordo exibida ao promotor antes das fotos.</p>
  <div class="card"><h3>Nova rede</h3><div class="row"><input id="newNet" placeholder="Nome da rede"><button class="btn" data-act="addNet">Adicionar</button></div></div>
  ${state.nets.map(n=>`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(n.name)}</h3><span class="muted">${state.stores.filter(s=>s.networkId===n.id).length} loja(s)</span></div>
  <label class="muted">Sabores desta rede (um por linha)</label><textarea id="fl-${esc(n.id)}">${esc((n.flavors||[]).join('\n'))}</textarea>
  <label class="muted">Popup / ação da rede (aparece para o promotor)</label><textarea id="pp-${esc(n.id)}" placeholder="Ex.: Na rede X teremos ação Y — ...">${esc(n.popup||'')}</textarea>
  <div class="row" style="margin-top:8px"><label><input type="checkbox" id="ac-${esc(n.id)}" ${n.active===false?'':'checked'}> Ativa</label><button class="btn" data-act="saveNet" data-id="${esc(n.id)}">Salvar</button><button class="btn red" data-act="delNet" data-id="${esc(n.id)}">Excluir</button></div></div>`).join('')||'<p class="muted">Nenhuma rede cadastrada.</p>'}`;
}
async function addNet(){
  const name=$('newNet').value.trim();if(!name)return;
  try{await setDoc(doc(db,'networks',slug(name)),{name,flavors:[],popup:'',active:true});await load();rRedes();toast('Rede criada')}catch(e){toast('Erro: '+(e.code||e.message),4000)}
}
async function saveNet(id){
  const fl=$('fl-'+id).value.split('\n').map(x=>x.trim()).filter(Boolean);
  try{await updateDoc(doc(db,'networks',id),{flavors:[...new Set(fl)],popup:$('pp-'+id).value.trim(),active:$('ac-'+id).checked});await load();toast('Rede salva ✓')}catch(e){toast('Erro: '+(e.code||e.message),4000)}
}
async function delNet(id){
  const n=state.nets.find(x=>x.id===id);const st=state.stores.filter(s=>s.networkId===id);

const decs=x=>{const s=String(x);return s.includes('.')?s.split('.')[1].length:0};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function geoInfo(lat,lng){
  const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat='+lat+'&lon='+lng,{headers:{'Accept':'application/json'}});
  const j=await r.json();const ad=j.address||{};const iso=ad['ISO3166-2-lvl4']||'';
  const uf=iso.startsWith('BR-')&&UFN[iso.slice(3)]?iso.slice(3):'';
  const rua=ad.road?ad.road+(ad.house_number?', '+ad.house_number:''):'';
  const bairro=ad.suburb||ad.neighbourhood||ad.quarter||'';
  const cid=ad.city||ad.town||ad.village||ad.municipality||'';
  const address=[rua,bairro,cid&&(cid+(uf?' - '+uf:''))].filter(Boolean).join(', ')||(j.display_name||'');
  return {uf,address};
}
async function ufFromCoord(lat,lng){return (await geoInfo(lat,lng)).uf}
function parseCoord(s){
  s=String(s||'');let m=s.match(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/)||s.match(/(-?\d{1,3}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/);
  if(!m)return null;const lat=parseFloat(m[1]),lng=parseFloat(m[2]);
  if(!(lat>=-34&&lat<=6&&lng>=-74&&lng<=-34))return null;
  return {lat,lng};
}
async function saveStore(){
  let uf=$('fUF').value,addr=$('fAddr').value.trim();const nid=$('fNet').value,name=$('fName').value.trim();if(!nid||!name)return toast('Escolha a rede e informe o nome');
  const n=state.nets.find(x=>x.id===nid);
  const c=parseCoord($('fCoord').value);
  if(!c)return toast('Coordenadas inválidas. Cole no formato -25.428412, -49.273251',4500);
  if(!uf||!addr){toast('Buscando estado e endereço pelas coordenadas…',2500);try{const g=await geoInfo(c.lat,c.lng);uf=uf||g.uf;addr=addr||g.address}catch(e){}if(!uf)return toast('Não consegui descobrir o estado. Escolha manualmente.',4500)}
  const data={networkId:nid,networkName:n.name,name,uf,address:addr,radius:parseInt($('fRad').value,10)||150,lat:c.lat,lng:c.lng};
  const id=state.editStore?state.editStore.id:nid+'__'+uf.toLowerCase()+'__'+slug(name);
  try{await setDoc(doc(db,'stores',id),data,{merge:true});state.editStore=null;await load();rLojas();toast('Loja salva ✓')}catch(e){toast('Erro: '+(e.code||e.message),4000)}
}
async function importStores(){
  const lines=$('imp').value.split('\n').map(l=>l.trim()).filter(Boolean);let ok=0,bad=0;
  for(const l of lines){
    const p=l.split(/;|\t/).map(x=>x.trim());if(p.length<4||!p[0]||!p[1]){bad++;continue}
    const cc=parseCoord(p[3]);if(!cc){bad++;continue}
    let uf=(p[2]||'').toUpperCase(),addr=p[4]||'';
    if(!uf||!addr){try{const g=await geoInfo(cc.lat,cc.lng);uf=uf||g.uf;addr=addr||g.address}catch(e){}await sleep(1100)}
    if(!UFN[uf]){bad++;continue}
    const nid=slug(p[0]);
    try{
      if(!state.nets.some(n=>n.id===nid)){await setDoc(doc(db,'networks',nid),{name:p[0].toUpperCase(),flavors:[],popup:'',active:true});state.nets.push({id:nid,name:p[0].toUpperCase()})}
      const n=state.nets.find(x=>x.id===nid);
      await setDoc(doc(db,'stores',nid+'__'+uf.toLowerCase()+'__'+slug(p[1])),{networkId:nid,networkName:n.name,name:p[1],uf,address:addr,radius:150,lat:cc.lat,lng:cc.lng},{merge:true});ok++;
    }catch(e){bad++}
  }
  $('impMsg').textContent=ok+' importada(s)'+(bad?', '+bad+' com erro':'');await load();rLojas();
}
async function fillUF(){
  const todo=state.stores.filter(s=>(!s.uf||!s.address)&&typeof s.lat==='number');let ok=0;
  for(let i=0;i<todo.length;i++){
    toast('Buscando '+(i+1)+'/'+todo.length+'…',1500);
    try{const g=await geoInfo(todo[i].lat,todo[i].lng);const up={};if(!todo[i].uf&&g.uf)up.uf=g.uf;if(!todo[i].address&&g.address)up.address=g.address;
      if(Object.keys(up).length){await updateDoc(doc(db,'stores',todo[i].id),up);ok++}}catch(e){}
    await sleep(1100);
  }
  await load();rLojas();toast(ok+' de '+todo.length+' preenchida(s).',4000);
}
async function delStore(id){
  const s=state.stores.find(x=>x.id===id);if(!confirm('Excluir a loja '+s.name+'?'))return;
  try{await deleteDoc(doc(db,'stores',id));await load();rLojas()}catch(e){toast('Erro: '+(e.code||e.message),4000)}
}

    o.n++;if(v.durationSec){o.dur+=v.durationSec;o.nd++}if((v.flags||[]).some(f=>SEVERE.includes(f)))o.sev++;o.last=Math.max(o.last,v.startedAt||0)});

/* ---------- AUDITORIA IA ---------- */
async function ai(content,max=350){
  const r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:max,messages:[{role:'user',content}]})});
  const j=await r.json();if(j.error)throw new Error(j.error.message||String(j.error));
  return (j.content||[]).map(x=>x.text||'').join('');
}
const b64=d=>d.split(',')[1];
const imgPart=d=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64(d)}});
function pc(h){let n=0;for(const ch of h){let x=parseInt(ch,16);while(x){n+=x&1;x>>=1}}return n}
function ham(a,b){let n=0;for(let i=0;i<a.length;i++){let x=parseInt(a[i],16)^parseInt(b[i],16);while(x){n+=x&1;x>>=1}}return n}
function findDups(thr){
  const items=[];
  state.visits.forEach(v=>{const h=v.photoHashes||{};Object.keys(h).forEach(k=>{if(h[k]&&h[k].length===16)items.push({v,k,h:h[k]})})});
  const buckets=new Map();
  items.forEach((it,i)=>{for(let c=0;c<8;c++){const key=c+':'+it.h.substr(c*2,2);let b=buckets.get(key);if(!b){b=[];buckets.set(key,b)}b.push(i)}});
  const seen=new Set(),out=[];
  buckets.forEach(b=>{if(b.length>400)return;for(let x=0;x<b.length;x++)for(let y=x+1;y<b.length;y++){
    const i=b[x],j=b[y];const A=items[i],B=items[j];if(A.v.id===B.v.id)continue;
    const key=i<j?i+'-'+j:j+'-'+i;if(seen.has(key))continue;seen.add(key);
    const d=ham(A.h,B.h);if(d<=thr)out.push({A,B,d});}});
  out.sort((a,b)=>a.d-b.d);return {out,total:items.length};
}
